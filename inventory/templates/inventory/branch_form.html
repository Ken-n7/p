{% extends 'inventory/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<a href="{% url 'branch_list' %}" class="back-link">
    <i class="fas fa-arrow-left" style="font-size:0.7rem;" aria-hidden="true"></i> Branches
</a>

<div class="form-narrow">
    <div class="page-head">
        <div>
            <h1>{{ title }}</h1>
            <p class="page-sub">{% if branch %}Update this branch's details.{% else %}Add an SM or Savemore branch EFP delivers to.{% endif %}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2 pt-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-floppy-disk" aria-hidden="true"></i>
                        {% if branch %}Save Changes{% else %}Add Branch{% endif %}
                    </button>
                    <a href="{% url 'branch_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
